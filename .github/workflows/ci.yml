name: Fynd CI

"on":
  push:
    branches:
      - main

  pull_request:
    branches:
      - main

jobs:
  build:
    runs-on: windows-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Setup .NET
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: '8.0.x'

      - name: Restore
        run: dotnet restore Fynd.Api.csproj

      - name: Build
        run: dotnet build Fynd.Api.csproj --no-restore --configuration Release

      - name: Test
        run: dotnet test Fynd.Api.csproj --no-build --configuration Release

      - name: Publish
        run: dotnet publish Fynd.Api.csproj --no-build --configuration Release --output ./publish

      - name: Upload published app
        uses: actions/upload-artifact@v4
        with:
          name: fynd-api
          path: ./publish

      - name: Deploy to MonsterASP
        if: github.event_name == 'push' && github.ref == 'refs/heads/main'
        uses: rasmusbuchholdt/simply-web-deploy@2.1.0
        with:
          website-name: ${{ secrets.WEBSITE_NAME }}
          server-computer-name: ${{ secrets.SERVER_COMPUTER_NAME }}
          server-username: ${{ secrets.SERVER_USERNAME }}
          server-password: ${{ secrets.SERVER_PASSWORD }}
